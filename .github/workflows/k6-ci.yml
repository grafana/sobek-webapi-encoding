# Copy to .github/workflows/k6-ci.yml. Pin @main to a SHA; Renovate keeps it updated.
# See grafana/k6-ci/README.md for details.
name: k6 CI
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: grafana/k6-ci/.github/workflows/all.yml@03469f9ae7aad25369827832c456e8f8b7b8c1c2 # v0.5.0
    with:
      # This repo is a Go library consumed via RegisterRuntime, not an xk6 extension.
      skip-extension-testing: true
      # Pinned to the same SHA as the `uses:` line above for a fully reproducible lint config.
      k6-ci-ref: 777962b022a831166517639e542630d8b7d1455f
